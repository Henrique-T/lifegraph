[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lifegraph-gliner-service"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "gliner2==2.0.0",
    "numpy==2.5.2",
    "peft==0.20.0",
    "protobuf>=5,<7",
    "safetensors==0.8.0",
    "torch==2.9.1",
    "transformers==5.8.0",
    "uvicorn==0.46.0",
]

[project.optional-dependencies]
test = [
    "httpx==0.28.1",
    "pytest==9.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
